<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Presentation · Hume</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <!-- Pairing -->
  <section id="pairView" class="pair hidden" aria-labelledby="pairTitle">
    <div class="pair-card">
      <div class="pair-badge" aria-hidden="true">
        <svg viewBox="0 0 24 24"><rect x="2.5" y="4" width="19" height="13" rx="2.5"/><path d="M8 20.5h8"/></svg>
      </div>
      <h1 id="pairTitle">Pair with your TV</h1>
      <p class="secondary">Enter the 6-digit code shown on the TV.</p>
      <form id="pairForm" autocomplete="off">
        <div id="pinBoxes" class="pin-boxes" role="group" aria-label="Pairing code">
          <input inputmode="numeric" maxlength="1" aria-label="Digit 1"><input inputmode="numeric" maxlength="1" aria-label="Digit 2"><input inputmode="numeric" maxlength="1" aria-label="Digit 3">
          <span class="pin-gap"></span>
          <input inputmode="numeric" maxlength="1" aria-label="Digit 4"><input inputmode="numeric" maxlength="1" aria-label="Digit 5"><input inputmode="numeric" maxlength="1" aria-label="Digit 6">
        </div>
        <button id="pairBtn" class="btn primary wide" type="submit" disabled>Pair</button>
      </form>
      <p id="pairError" class="error" role="alert"></p>
      <p id="pairHint" class="tertiary small">Can’t see the code? On the TV, open Presentation and press ▲ on the remote.</p>
    </div>
  </section>

  <!-- App -->
  <div id="appView" class="hidden">
    <header class="nav">
      <div class="nav-inner">
        <div class="brand">
          <span class="brand-dot" aria-hidden="true"></span>
          <div>
            <div class="brand-title">Presentation</div>
            <div id="deviceName" class="brand-sub">Hume Launcher</div>
          </div>
        </div>
        <div class="segmented" role="tablist" aria-label="Sections">
          <button id="tabLibrary" role="tab" aria-selected="true" data-tab="library">Library</button>
          <button id="tabPlaylist" role="tab" aria-selected="false" data-tab="playlist">Playlist</button>
        </div>
        <button id="unpairBtn" class="btn plain small" type="button" title="Forget this browser">Unpair</button>
      </div>
    </header>

    <!-- Now Playing -->
    <section class="now" aria-label="Now playing on TV">
      <div class="now-info">
        <span id="nowDot" class="status-dot" aria-hidden="true"></span>
        <div>
          <div id="nowTitle" class="now-title">Connecting…</div>
          <div id="nowSub" class="now-sub secondary"></div>
        </div>
      </div>
      <div class="now-controls">
        <button class="icon-btn" data-cmd="previous" title="Previous slide" aria-label="Previous slide"><svg viewBox="0 0 24 24"><path d="M7 6v12M18 6l-8 6 8 6z"/></svg></button>
        <button id="playPause" class="icon-btn big" data-cmd="pause" title="Pause" aria-label="Pause"><svg viewBox="0 0 24 24"><path id="ppIcon" d="M8 5v14M16 5v14"/></svg></button>
        <button class="icon-btn" data-cmd="next" title="Next slide" aria-label="Next slide"><svg viewBox="0 0 24 24"><path d="M17 6v12M6 6l8 6-8 6z"/></svg></button>
        <button class="icon-btn" data-cmd="restart" title="Start over" aria-label="Start over"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.3-5.6M4 4v4h4"/></svg></button>
        <button class="btn tinted small" data-cmd="showConnectionInfo" title="Show the address and code on the TV">Show code on TV</button>
      </div>
    </section>

    <main class="content">
      <!-- Library -->
      <section id="libraryView" aria-label="Library">
        <label id="dropZone" class="drop" tabindex="0">
          <input id="fileInput" type="file" accept="image/*,video/*" multiple hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4M7.5 8.5 12 4l4.5 4.5M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>
          <div class="drop-title">Drop images or videos here</div>
          <div class="secondary small">or <span class="link">choose files</span> · uploads go straight to the TV</div>
        </label>
        <div id="uploads" class="uploads"></div>

        <div class="section-head">
          <h2>Library <span id="mediaCount" class="count"></span></h2>
          <div class="segmented small" role="group" aria-label="Filter">
            <button data-filter="all" aria-pressed="true">All</button>
            <button data-filter="image" aria-pressed="false">Images</button>
            <button data-filter="video" aria-pressed="false">Videos</button>
          </div>
        </div>
        <div id="mediaGrid" class="grid"></div>
      </section>

      <!-- Playlist -->
      <section id="playlistView" class="hidden" aria-label="Playlist">
        <div class="section-head">
          <h2>Playlist <span id="slideCount" class="count"></span></h2>
          <div class="head-actions">
            <span id="loopTime" class="pill"></span>
            <button id="addWebpageBtn" class="btn tinted small" type="button">Add Webpage</button>
            <button id="addMediaBtn" class="btn primary small" type="button">Add from Library</button>
          </div>
        </div>
        <form id="webpageForm" class="inline-add hidden">
          <input id="webpageUrl" type="url" placeholder="https://example.com/dashboard" aria-label="Webpage address" required>
          <button class="btn primary small" type="submit">Add</button>
          <button id="cancelWebpage" class="btn plain small" type="button">Cancel</button>
        </form>
        <div id="slides" class="list"></div>
        <div id="slidesEmpty" class="empty hidden">No slides yet. Add files from your Library or a webpage.</div>
      </section>
    </main>

    <!-- Save bar -->
    <div id="saveBar" class="savebar" aria-live="polite">
      <div>
        <div class="savebar-title">Unsaved changes</div>
        <div id="saveError" class="error small"></div>
      </div>
      <div class="savebar-actions">
        <button id="revertBtn" class="btn plain" type="button">Revert</button>
        <button id="saveBtn" class="btn primary" type="button">Save to TV</button>
      </div>
    </div>
  </div>

  <!-- Sheets -->
  <div id="sheet" class="sheet hidden" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-card">
      <div class="sheet-head">
        <h3 id="sheetTitle"></h3>
        <button id="sheetClose" class="btn plain small" type="button">Done</button>
      </div>
      <div id="sheetBody" class="sheet-body"></div>
    </div>
  </div>
  <div id="confirm" class="sheet hidden" role="alertdialog" aria-modal="true" aria-labelledby="confirmTitle">
    <div class="alert">
      <h3 id="confirmTitle"></h3>
      <p id="confirmText" class="secondary"></p>
      <div class="alert-actions">
        <button id="confirmCancel" class="btn plain" type="button">Cancel</button>
        <button id="confirmOk" class="btn destructive" type="button">Delete</button>
      </div>
    </div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="/app.js"></script>
</body>
</html>
